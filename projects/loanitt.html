<footer id="contact">
  <div class="wrap">
    <button type="button" class="contact-link" id="contact-open">Contact</button>
    <span class="footer-meta">Dublin, Ireland</span>
  </div>
</footer>

<dialog id="contact-dialog">
  <h2>Contact</h2>
  <form id="contact-form" class="contact-form">
    <label>Name
      <input type="text" name="name" required>
    </label>
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Message
      <textarea name="message" rows="5" required></textarea>
    </label>
    <div class="dialog-actions">
      <button type="button" id="contact-cancel">Cancel</button>
      <button type="submit" class="btn-primary">Send</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  var dialog = document.getElementById('contact-dialog');
  var openBtn = document.getElementById('contact-open');
  var cancelBtn = document.getElementById('contact-cancel');
  var form = document.getElementById('contact-form');
  if(!dialog || !openBtn) return;
  openBtn.addEventListener('click', function(){ dialog.showModal(); });
  cancelBtn.addEventListener('click', function(){ dialog.close(); });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = form.name.value.trim();
    var email = form.email.value.trim();
    var message = form.message.value.trim();
    var subject = encodeURIComponent('Website enquiry from ' + name);
    var body = encodeURIComponent(message + '\n\nFrom: ' + email);
    window.location.href = 'mailto:louis@louisjoyntdefouw.com?subject=' + subject + '&body=' + body;
    dialog.close();
  });
})();
</script>
